name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: JS size budget
        run: npm run check:size
      - run: npx playwright install --with-deps chromium
      - name: Smoke, overflow, reduced motion, axe
        run: npm run test:e2e
      - name: Lighthouse budget (dist/)
        if: github.event_name != 'pull_request'
        run: npm run lhci
      # Vercel only posts a commit status (no GitHub deployments), so wait for it, then take the
      # preview URL from the Vercel bot comment.
      - name: Wait for Vercel preview
        if: github.event_name == 'pull_request'
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for i in $(seq 60); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')
            echo "Vercel status: $state"
            case $state in
              success) break ;;
              failure|error) exit 1 ;;
            esac
            [ "$i" = 60 ] && { echo "Timed out waiting for Vercel"; exit 1; }
            sleep 15
          done
          url=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '[.[] | select(.user.login == "vercel[bot]")][-1].body' | grep -o 'https://[a-z0-9-]*\.vercel\.app' | head -1)
          [ -n "$url" ] || { echo "No preview URL in the Vercel comment"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      # Previews sit behind Vercel Authentication (bypass header, plus the cookie for side requests
      # like robots.txt that skip extraHeaders) and are served with
      # X-Robots-Tag: noindex, so is-crawlable is skipped there; the dist/ run on main still checks it.
      - name: Lighthouse budget (Vercel preview)
        if: github.event_name == 'pull_request'
        env:
          U: ${{ steps.preview.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: >-
          npx lhci autorun --collect.staticDistDir= --collect.url="$U/" --collect.url="$U/projects/gotdle/"
          --collect.settings.extraHeaders="{\"x-vercel-protection-bypass\":\"$BYPASS\",\"x-vercel-set-bypass-cookie\":\"true\"}"
          --collect.settings.skipAudits=is-crawlable
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
